<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">

    <title>Cửa Hàng Thời Trang</title>

    <style>

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { background-color: #f8f9fa; color: #333; }

       

        header { background: #ffffff; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .logo-container { display: flex; align-items: center; gap: 15px; }

        .logo-container img { height: 40px; width: 40px; object-fit: cover; border-radius: 50%; border: 2px solid #007bff; }

        .logo-container h1 { font-size: 22px; color: #2c3e50; }

       

        nav a { margin-left: 20px; text-decoration: none; color: #555; font-weight: 600; }

        nav a:hover, nav a.active { color: #007bff; }



        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }

        h2 { margin-bottom: 25px; color: #2c3e50; border-bottom: 2px solid #007bff; padding-bottom: 10px; display: inline-block; }



        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }

        .product-card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.3s, box-shadow 0.3s; display: flex; flex-direction: column; }

        .product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }

       

        .product-img { width: 100%; height: 220px; object-fit: cover; background-color: #e9ecef; }

        .product-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }

       

        .product-info h3 { font-size: 18px; color: #333; margin-bottom: 10px; }

        .price { color: #e74c3c; font-size: 18px; font-weight: bold; margin-bottom: 15px; }

       

        .btn-buy { background: #007bff; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; text-align: center; text-decoration: none; transition: background 0.3s; }

        .btn-buy:hover { background: #0056b3; }

       

        .no-product { grid-column: 1 / -1; text-align: center; padding: 50px; font-size: 18px; color: #777; background: #fff; border-radius: 10px; }

    </style>

</head>

<body>

    <header>

        <div class="logo-container">

            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo">

            <h1>Quanchan clothing</h1>

        </div>

        <nav>

            <a href="/">Trang Chủ</a>

            <a href="/shop" class="active">Cửa Hàng</a>

            <a href="/contact">Liên Hệ</a>

            <a href="/admin">Quản Trị</a>

        </nav>

    </header>



    <div class="container">

        <h2>Danh Sách Sản Phẩm</h2>

        <div class="product-grid">

            {% for p in products %}

            <div class="product-card">

                <!-- Hiển thị ảnh sản phẩm từ thư mục static/images/ -->

                <img class="product-img" src="{{ url_for('static', filename='images/' + (p.HinhAnh if p.HinhAnh else 'default.jpg')) }}" alt="{{ p.TenSanPham }}">

                <div class="product-info">

                    <div>

                        <h3>{{ p.TenSanPham }}</h3>

                        <p class="price">{{ "{:,.0f}".format(p.Gia) }} VNĐ</p>

                    </div>

                    <a href="#" class="btn-buy">Thêm Vào Giỏ</a>

                </div>

            </div>

            {% else %}

            <div class="no-product">

                <p>Hiện tại chưa có sản phẩm nào trong cơ sở dữ liệu.</p>

            </div>

            {% endfor %}

        </div>

    </div>

</body>

</html>
